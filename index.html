<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a3d62">
<title>Chipunka Congregation - Publisher Record</title>
<style>
body{font-family:Arial,sans-serif;background:#eef2f7;margin:0;padding:0}
header{background:#0a3d62;color:#fff;text-align:center;padding:20px 10px}
header h1{margin:0;font-size:22px}
header p{margin:5px 0}
.badge{display:inline-block;padding:6px 14px;border-radius:20px;font-weight:bold;margin:4px}
.yellow{background:#ffcc00;color:#000}
.green{background:#2ecc71;color:#fff}
.card{background:#fff;margin:15px;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
button{width:100%;padding:14px;margin:8px 0;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
.blue{background:#007bff;color:#fff}
.grey{background:#ddd}
.orange{background:#ff6b00;color:#fff}
.greenbtn{background:#1a8a4a;color:#fff}
input,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
label{font-weight:bold;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid #ddd;padding:6px;text-align:center}
th{background:#0a3d62;color:#fff}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h1 id="congTitle">CHIPUNKA CONGREGATION - PUBLISHER RECORD</h1>
<p id="congSub">S-21-E • Chipunka Congregation</p>
<div><span class="badge yellow" id="yearBadge">Service Year: 2027 - 2028 • Automatic</span></div>
<div><span class="badge green" id="todayBadge">Today is: November • But YOU choose month below</span></div>
</header>

<div class="card" id="welcomeCard">
<h2 style="color:#0a3d62;margin-top:0">Welcome</h2>
<button class="blue" onclick="showPublisher()">I AM A PUBLISHER</button>
<button class="grey" onclick="askPin()">I AM SECRETARY 🔒</button>
<button onclick="showSettings()" style="background:#ff9800; color:white; padding:12px; width:100%; border:none; border-radius:8px; font-weight:bold;">⚙️ SETTINGS - Congregation, PIN</button>
<button class="orange" onclick="showSettings()">⚙️ SETTINGS - Congregation, PIN, Backup</button>
<button class="greenbtn" onclick="installApp()">📱 INSTALL APP ON PHONE</button>
</div>

<div class="card hidden" id="publisherCard">
<h2>Publisher Record</h2>
<label>Publisher Name</label>
<input id="pubName" placeholder="Full Name">
<label>Choose Month</label>
<select id="monthSelect"></select>
<label>Field Service Group</label>
<input id="pubGroup" placeholder="Group No.">
<label>Privileges</label>
<select id="pubPriv"><option>Publisher</option><option>Regular Pioneer</option><option>Special Pioneer</option><option>Elder</option><option>Ministerial Servant</option></select>
<table>
<tr><th>Month</th><th>Hours</th><th>Bible Studies</th><th>Remarks</th></tr>
<tr><td id="rowMonth">November</td><td><input id="fHours" type="number"></td><td><input id="fStudies" type="number"></td><td><input id="fRemarks"></td></tr>
</table>
<button class="blue" onclick="saveEntry()">💾 SAVE THIS MONTH</button>
<button class="grey" onclick="goHome()">⬅ Back</button>
<div id="history"></div>
</div>

<div class="card hidden" id="settingsCard">
<h2>Settings</h2>
<label>Congregation Name</label>
<input id="setCong" value="Chipunka Congregation">
<label>Secretary PIN (default 1234)</label>
<input id="setPin" value="1234">
<button class="blue" onclick="saveSettings()">💾 SAVE SETTINGS</button>
<button class="grey" onclick="goHome()">⬅ Back</button>
</div>

<div class="card hidden" id="secretaryCard">
<h2>Secretary - All Publishers</h2>
<div id="allData"></div>
<button class="grey" onclick="goHome()">⬅ Back</button>
</div>

<script>
let months=["September","October","November","December","January","February","March","April","May","June","July","August"];
let calendarMonths=["January","February","March","April","May","June","July","August","September","October","November","December"];
let now=new Date();
let CURRENT_MONTH=calendarMonths[now.getMonth()];
let cong=localStorage.getItem('cong')||'Chipunka Congregation';

function serviceYear(){
  let y=now.getFullYear();
  let m=now.getMonth();
  if(m>=8) return y+" - "+(y+1);
  return (y-1)+" - "+y;
}

function updateHeader(){
  document.getElementById('congTitle').innerText=cong.toUpperCase()+" - PUBLISHER RECORD";
  document.getElementById('congSub').innerText="S-21-E • "+cong;
  document.getElementById('yearBadge').innerText="Service Year: "+serviceYear()+" • Automatic";
  document.getElementById('todayBadge').innerText="Today is: "+CURRENT_MONTH+" • But YOU choose month below";
  document.getElementById('setCong').value=cong;
}

let sel=document.getElementById('monthSelect');
months.forEach(m=>{
  let o=document.createElement('option'); o.text=m; o.value=m;
  if(m===CURRENT_MONTH) o.selected=true;
  sel.appendChild(o);
});
sel.onchange=()=>{document.getElementById('rowMonth').innerText=sel.value; loadEntry();};

function goHome(){
  document.querySelectorAll('.card').forEach(c=>c.classList.add('hidden'));
  document.getElementById('welcomeCard').classList.remove('hidden');
}
function showPublisher(){
  document.querySelectorAll('.card').forEach(c=>c.classList.add('hidden'));
  document.getElementById('publisherCard').classList.remove('hidden');
  loadEntry();
}
function showSettings(){
  document.querySelectorAll('.card').forEach(c=>c.classList.add('hidden'));
  document.getElementById('settingsCard').classList.remove('hidden');
}
function saveSettings(){
  cong=document.getElementById('setCong').value||'Chipunka Congregation';
  localStorage.setItem('cong',cong);
  localStorage.setItem('pin',document.getElementById('setPin').value||'1234');
  updateHeader(); alert('Saved! Now shows: '+cong); goHome();
}
function askPin(){
  let p=prompt('Enter Secretary PIN:');
  let saved=localStorage.getItem('pin')||'1234';
  if(p===saved){
    document.querySelectorAll('.card').forEach(c=>c.classList.add('hidden'));
    document.getElementById('secretaryCard').classList.remove('hidden');
    showAll();
  } else if(p!==null) alert('Wrong PIN');
}
function saveEntry(){
  let name=document.getElementById('pubName').value.trim();
  if(!name){alert('Enter your name');return;}
  let key='pub_'+name+'_'+sel.value;
  let data={name:name,month:sel.value,group:document.getElementById('pubGroup').value,priv:document.getElementById('pubPriv').value,hours:document.getElementById('fHours').value,studies:document.getElementById('fStudies').value,remarks:document.getElementById('fRemarks').value};
  localStorage.setItem(key,JSON.stringify(data));
  alert('Saved for '+name+' - '+sel.value);
  loadEntry();
}
function loadEntry(){
  let name=document.getElementById('pubName').value.trim();
  if(!name) return;
  let key='pub_'+name+'_'+sel.value;
  let d=JSON.parse(localStorage.getItem(key)||'null');
  let h=document.getElementById('history');
  if(d){
    document.getElementById('fHours').value=d.hours;
    document.getElementById('fStudies').value=d.studies;
    document.getElementById('fRemarks').value=d.remarks;
    h.innerHTML='<p><b>Saved:</b> '+d.month+' - Hours: '+d.hours+', Studies: '+d.studies+'</p>';
  } else {
    document.getElementById('fHours').value='';
    document.getElementById('fStudies').value='';
    document.getElementById('fRemarks').value='';
    h.innerHTML='';
  }
}
document.getElementById('pubName').oninput=loadEntry;
function showAll(){
  let html='<table><tr><th>Name</th><th>Month</th><th>Hours</th><th>Studies</th></tr>';
  for(let i=0;i<localStorage.length;i++){
    let k=localStorage.key(i);
    if(k.startsWith('pub_')){
      let d=JSON.parse(localStorage.getItem(k));
      html+='<tr><td>'+d.name+'</td><td>'+d.month+'</td><td>'+d.hours+'</td><td>'+d.studies+'</td></tr>';
    }
  }
  html+='</table>';
  document.getElementById('allData').innerHTML=html;
}
function installApp(){ alert('In Chrome, tap 3 dots > Add to Home screen / Install app'); }
updateHeader();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
