<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Chipunka Congregation - Publisher Record</title>
<meta name="theme-color" content="#0a3d62">
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#eef2f5}
.header{background:#0a3d62;color:#fff;text-align:center;padding:20px 12px}
.header h1{font-size:20px;margin:0;line-height:1.3}
.header p{margin:6px 0}
.badge{background:#ffcc00;color:#000;display:inline-block;padding:8px 14px;border-radius:20px;font-weight:bold;font-size:14px}
.today{background:#22c55e;color:#fff;padding:10px;border-radius:10px;font-weight:bold;margin:10px auto;max-width:500px}
.card{background:#fff;margin:14px auto;max-width:500px;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
h2{color:#0a3d62;margin-top:0}
button{width:100%;padding:14px;margin:8px 0;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
.btn-blue{background:#007bff;color:#fff}
.btn-grey{background:#e5e7eb;color:#000}
.btn-green{background:#16a34a;color:#fff}
.btn-red{background:#dc2626;color:#fff}
.btn-dark{background:#0a3d62;color:#fff}
.btn-small{width:auto;padding:8px 12px;font-size:13px;margin:4px 2px}
.btn-active{background:#0a3d62;color:#fff}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:15px}
label{font-weight:bold;font-size:14px;color:#333}
.hidden{display:none}
.small{font-size:13px;color:#666}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid #ddd;padding:6px;text-align:left}
th{background:#0a3d62;color:#fff}
.back{position:fixed;right:12px;top:50%;background:#0a3d62;color:#fff;width:42px;height:42px;border-radius:50%;font-size:20px;z-index:99}
.check-row{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.check-row label{font-weight:normal;display:flex;align-items:center;gap:6px}
.check-row input{width:auto;margin:0}
.check-box{display:flex;align-items:center;gap:8px;background:#f3f4f6;padding:12px;border-radius:8px;margin:6px 0}
.check-box input{width:22px;height:22px}
.profile-box{background:#e0f2fe;padding:12px;border-radius:8px;margin-bottom:12px;font-size:14px}
.hidden-settings{font-size:11px;color:#bbb;text-align:center;margin-top:14px;cursor:pointer}
.cat-bar{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.tag{display:inline-block;background:#0a3d62;color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;margin-left:4px}
.tag-pioneer{background:#ff9800;color:#000}
</style>
</head>
<body>
<div class="header">
<h1>CHIPUNKA CONGREGATION -<br>PUBLISHER RECORD</h1>
<p>CONGREGATION'S PUBLISHER RECORD • S-21</p>
<div class="badge">Service Year: <span id="serviceYearTop">2026 - 2027</span></div>
<div class="today">Today is: <span id="todayText"></span></div>
</div>
<div id="welcomeView" class="card">
<h2>Welcome</h2>
<button class="btn-blue" onclick="showView('publisherView')">I AM A PUBLISHER</button>
<button class="btn-grey" onclick="askSecretaryPIN()">I AM SECRETARY 🔒</button>
<button class="btn-green" onclick="installApp()">📱 INSTALL APP ON PHONE</button>
<p class="small">Publisher: Select your name (added by Secretary), then submit your monthly report.</p>
</div>
